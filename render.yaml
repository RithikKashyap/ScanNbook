services:
  # Backend Service
  - type: web
    name: qr-booking-backend
    runtime: node
    branch: main
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    autoDeploy: true

  # Frontend Service
  - type: web
    name: qr-booking-frontend
    runtime: node
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    autoDeploy: true
